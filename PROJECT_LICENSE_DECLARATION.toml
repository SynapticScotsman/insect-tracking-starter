[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insect-evs"
version = "0.1.0"
description = "Event-based vision processing for insect flight: clutter rejection by wingbeat periodicity, tracking, and individual identification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paul Kirkland" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "opencv-python>=4.6",
    "matplotlib>=3.5",
    "pandas>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fast = ["numba>=0.57"]
rust = ["insect_evs_rust"]
io = ["h5py>=3.7", "expelliarmus>=1.1", "tonic>=1.4"]
dev = ["pytest>=7.0"]

[project.scripts]
insect-evs = "insect_evs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
